[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.install]
cmds = ["node -e \"const cp=require('child_process'), fs=require('fs'); if(fs.existsSync('server')){cp.execSync('cd server && npm install', {stdio:'inherit'});} cp.execSync('npm install', {stdio:'inherit'});\""]

[start]
cmd = "node -e \"if(require('fs').existsSync('server')){process.chdir('server');} require('./index.js');\""
